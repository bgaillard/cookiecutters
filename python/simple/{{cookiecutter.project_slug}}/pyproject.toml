[project]
name = "app"
version = "1.0.0"
description = "Simple project"
authors = [
  {name = "Baptiste Gaillard", email = "baptiste.gaillard@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"

# Show outdated packages: poetry show -o

[tool.poetry.group.main.dependencies]
pydantic-settings = "^2.9"
python-dotenv = "^1.1"
structlog = "^25.2"

[tool.poetry.group.dev.dependencies]
anyio = "^4.9"
colorama = "^0.4"
coverage = "^7.8"
pyright = "^1.1"
pytest = "^8.3"
pytest-cov = "^6.1"
ruff = "^0.11"
trio = "^0.29"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
pytest-cov = "^6.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pylint.'MESSAGES CONTROL']
disable = "missing-class-docstring,missing-function-docstring,missing-module-docstring,redefined-builtin,redefined-outer-name,unused-argument"

# @see https://microsoft.github.io/pyright
# @see https://github.com/microsoft/pyright/blob/main/docs/configuration.md
[tool.pyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
executionEnvironments = [
  { root = "." }
]
