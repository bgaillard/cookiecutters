# @see https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "app"
version = "1.0.0"
description = "Simple project"
authors = [
  {name = "Baptiste Gaillard", email = "baptiste.gaillard@gmail.com"}
]
readme = "README.md"

# @see https://iscinumpy.dev/post/bound-version-constraints/
requires-python = ">=3.13,<4.0"
dependencies = [
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
]
[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
lint = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.3"
]


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pylint.'MESSAGES CONTROL']
disable = "missing-class-docstring,missing-function-docstring,missing-module-docstring,redefined-builtin,redefined-outer-name,unused-argument"

# @see https://microsoft.github.io/pyright
# @see https://github.com/microsoft/pyright/blob/main/docs/configuration.md
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
executionEnvironments = [
  { root = "." }
]
