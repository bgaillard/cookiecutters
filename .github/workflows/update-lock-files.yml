---
name: Update lock files

on:
  push:
    branches:
      - 'dependabot/**'
    paths:
      - 'python/simple/**/pyproject.toml'
      - 'python/fast-api-simple/**/pyproject.toml'

jobs:
  update-lock-files:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # @see https://github.com/actions/setup-python/issues/967#issuecomment-2430610509
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install poetry
        run: pipx install poetry
      - name: Update python/simple lock files
        working-directory: "python/simple/{{cookiecutter.project_slug}}"
        run: |
          uv lock
          poetry lock
      - name: Update python/fast-api-simple lock files
        working-directory: "python/fast-api-simple/{{cookiecutter.project_slug}}"
        run: |
          uv lock
          poetry lock
      - name: Commit and push lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "python/simple/{{cookiecutter.project_slug}}/uv.lock"
          git add "python/simple/{{cookiecutter.project_slug}}/poetry.lock"
          git add "python/fast-api-simple/{{cookiecutter.project_slug}}/uv.lock"
          git add "python/fast-api-simple/{{cookiecutter.project_slug}}/poetry.lock"
          git diff --cached --quiet || git commit -m "chore: update lock files after pyproject.toml update"
          git push
